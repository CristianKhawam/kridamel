<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product · KRIDAMEL</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/customer/css/customer.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <p id="status" class="status" role="status"></p>

    <!-- Filled by product.js once the product is loaded. -->
    <article id="product" class="product-detail" hidden>
      <div class="gallery">
        <img id="main-image" alt="">
        <div id="thumbnails" class="thumbnails"></div>
      </div>

      <div class="product-info">
        <a id="category-link" class="muted"></a>
        <h1 id="product-name"></h1>
        <p id="product-brand" class="muted"></p>
        <p id="product-price" class="price big"></p>
        <div id="product-tags" class="chips"></div>
        <p id="product-description"></p>

        <!-- One group of buttons per attribute (colour, size…), built by the script. -->
        <div id="options"></div>

        <p id="stock" class="stock" aria-live="polite"></p>
        <label>Quantity <input id="quantity" type="number" min="1" value="1"></label>
        <button id="add-to-cart" class="btn" type="button" disabled>Add to cart</button>
        <p id="cart-message" class="status" role="status"></p>
      </div>
    </article>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/customer/js/layout.js"></script>
  <script src="/customer/js/product.js"></script>
</body>
</html>
