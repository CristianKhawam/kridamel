<!doctype html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KRIDAMEL · Your World. Your Store.</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/customer/css/customer.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <section class="hero">
      <h1>Your World. Your Store.</h1>
      <p>Clothing, electronics and sports gear for all of Canada. Pick up in store or get it delivered.</p>
    </section>

    <p id="status" class="status" role="status"></p>

    <div id="categories" class="category-grid"></div>

    <h2>Featured</h2>
    <div id="featured" class="product-grid"></div>

    <h2>Best sellers</h2>
    <div id="best-sellers" class="product-grid"></div>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/customer/js/layout.js"></script>

</html>
