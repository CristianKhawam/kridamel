<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account · KRIDAMEL</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/customer/css/customer.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <h1>Create an account</h1>

    <form id="register-form" class="form" novalidate>
      <label>Demo profile
        <select name="profile">
          <option value="">None – I will type my own details</option>
        </select>
      </label>
      <p class="muted">A demo profile fills in a fictitious name, phone and address. Your email and password are always yours to type.</p>

      <label>Name <input name="name" autocomplete="name" required></label>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Password <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Phone (optional) <input name="phone" type="tel" autocomplete="tel"></label>

      <fieldset class="form">
        <legend>Address (optional)</legend>
        <label>Street <input name="address.line1" autocomplete="address-line1"></label>
        <div class="form-row">
          <label>City <input name="address.city" autocomplete="address-level2"></label>
          <label>Province <input name="address.province" autocomplete="address-level1"></label>
          <label>Postal code <input name="address.postalCode" autocomplete="postal-code"></label>
        </div>
      </fieldset>

      <button class="btn" type="submit">Create account</button>
      <p id="status" class="status" role="status"></p>
    </form>

    <p>Already have an account? <a href="/customer/login.html">Log in</a></p>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/customer/js/layout.js"></script>
  <script src="/customer/js/register.js"></script>
</body>
</html>
